version: 2

# Dependabot commits are not authored by the maintainer, so the Commits check
# fails on its PRs by design. The maintainer re-applies accepted updates as
# signed commits (CONTRIBUTING.md).
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: docs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
