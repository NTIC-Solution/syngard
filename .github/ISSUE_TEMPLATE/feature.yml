name: Feature request
description: Propose a capability or improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to achieve and why the current behavior is not enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and acceptance criteria
      description: Expected behavior, and how we would know it works (tests, outputs).
    validations:
      required: true
